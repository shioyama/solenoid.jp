title: Solenoid
description: Cafe - Space - Lab
url: "https://solenoid.jp"
baseurl: ""

# Build settings
markdown: kramdown
permalink: pretty

# Plugins
plugins:
  - jekyll-redirect-from

# Include custom files
include:
  - _headers

# Exclude from processing
exclude:
  - deploy.sh
  - Gemfile
  - Gemfile.lock

# Collections
defaults:
  - scope:
      path: ""
    values:
      layout: "default"